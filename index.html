<style>
:root{
  --ink:#0B0F1A;
  --ink-2:#121A2C;
  --ink-3:#1C2740;
  --ink-4:#26314D;
  --silver:#E4E7F2;
  --silver-dim:#8B93AC;
  --wolf:#B23347;
  --wolf-glow:rgba(178,51,71,.5);
  --village:#4C7C6E;
  --village-glow:rgba(76,124,110,.45);
  --gold:#CDA854;
  --gold-glow:rgba(205,168,84,.5);
  --parchment:#EAE2C9;
  --parchment-2:#DED2AC;
  --parchment-ink:#2B2013;
  --radius-lg:22px;
  --radius-md:14px;
  --font-display:'Cinzel', Georgia, 'Times New Roman', serif;
  --font-body:'Work Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', 'Consolas', monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(76,124,110,.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 100%, rgba(178,51,71,.10), transparent 60%),
    var(--ink);
  color:var(--silver);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}

/* Ambient stars */
#stars{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;}
#stars span{
  position:absolute; width:2px; height:2px; background:var(--silver); border-radius:50%;
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }

#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}

.wrap{
  flex:1; width:100%; max-width:560px; margin:0 auto;
  padding:32px 20px 48px; display:flex; flex-direction:column; gap:22px;
}

/* ---------- Header / eyebrow ---------- */
.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--silver-dim); text-align:center;
}
h1.title{
  font-family:var(--font-display); font-weight:700; letter-spacing:.04em;
  font-size:clamp(28px,7vw,40px); text-align:center; margin:0;
  color:var(--silver);
  text-shadow:0 0 30px rgba(205,168,84,.18);
}

}
.subtitle{ text-align:center; color:var(--silver-dim); font-size:14.5px; line-height:1.5; margin:-8px 0 0;}

/* ---------- Cards / panels ---------- */
.panel{
  background:linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid rgba(228,231,242,.08);
  border-radius:var(--radius-lg);
  padding:20px;
  box-shadow:0 20px 40px -20px rgba(0,0,0,.6);
}
.panel h2{
  font-family:var(--font-display); font-size:15px; letter-spacing:.06em; margin:0 0 14px;
  color:var(--gold); text-transform:uppercase; font-weight:600;
}

/* ---------- Stepper ---------- */
.stepper{ display:flex; align-items:center; justify-content:center; gap:18px; }
.stepper button{
  width:46px; height:46px; border-radius:50%; border:1px solid rgba(228,231,242,.18);
  background:var(--ink-4); color:var(--silver); font-size:20px; cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.stepper button:hover{ background:#31406330; transform:translateY(-1px); }
.stepper button:active{ transform:scale(.94); }
.stepper button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.stepper .count{
  font-family:var(--font-mono); font-size:34px; font-weight:700; min-width:64px; text-align:center; color:var(--gold);
}

/* ---------- Inputs ---------- */
.field-label{ font-size:12.5px; color:var(--silver-dim); margin:0 0 6px; letter-spacing:.02em; }
input[type=text]{
  width:100%; background:var(--ink); border:1px solid rgba(228,231,242,.14);
  color:var(--silver); font-family:var(--font-body); font-size:15px; padding:12px 14px;
  border-radius:var(--radius-md); transition:border-color .15s ease;
}
input[type=text]:focus{ outline:none; border-color:var(--gold); }
input[type=text]:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

.name-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.name-badge{
  width:26px; height:26px; border-radius:50%; background:var(--ink-4); color:var(--gold);
  font-family:var(--font-mono); font-size:12px; display:flex; align-items:center; justify-content:center; flex:none;
}

/* ---------- Role chips ---------- */
.role-list{ display:flex; flex-direction:column; gap:10px; }
.role-row{
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  background:var(--ink); border:1px solid rgba(228,231,242,.08); border-radius:var(--radius-md);
}
.role-row .icon{ width:30px; height:30px; flex:none; }
.role-row .info{ flex:1; min-width:0; }
.role-row .name{ font-size:14px; font-weight:600; }
.role-row .team-tag{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 7px; border-radius:20px; flex:none;
}
.tag-loup{ color:var(--wolf); border:1px solid var(--wolf); }
.tag-village{ color:var(--village); border:1px solid var(--village); }
.tag-special{ color:var(--gold); border:1px solid var(--gold); }

.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:var(--radius-md); background:var(--ink); border:1px solid rgba(228,231,242,.08); margin-bottom:8px;}
.toggle-row .info{ display:flex; flex-direction:column; gap:2px; }
.toggle-row .name{ font-size:14px; font-weight:600; }
.toggle-row .desc{ font-size:12px; color:var(--silver-dim); }
.switch{ position:relative; width:44px; height:26px; flex:none; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:#33405C; border-radius:20px; transition:background .15s ease; cursor:pointer; }
.switch .thumb{ position:absolute; top:3px; left:3px; width:20px; height:20px; background:var(--silver); border-radius:50%; transition:transform .15s ease; }
.switch input:checked + .track{ background:var(--village); }
.switch input:checked + .track .thumb{ transform:translateX(18px); }
.switch input:focus-visible + .track{ outline:2px solid var(--gold); outline-offset:2px; }

.hint{ font-size:12.5px; color:var(--silver-dim); line-height:1.5; margin-top:4px;}
.warn{ font-size:12.5px; color:var(--gold); line-height:1.5; margin-top:8px; padding:8px 10px; background:rgba(205,168,84,.08); border-left:2px solid var(--gold); border-radius:6px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-body); font-weight:600; font-size:15px; letter-spacing:.01em;
  padding:15px 22px; border-radius:14px; border:none; cursor:pointer; width:100%;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(.98); }
.btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.btn-primary{ background:linear-gradient(180deg, var(--gold), #B08C3F); color:#241B0C; box-shadow:0 10px 26px -10px var(--gold-glow); }
.btn-primary:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; }
.btn-ghost{ background:transparent; color:var(--silver-dim); border:1px solid rgba(228,231,242,.16); }
.btn-ghost:hover{ color:var(--silver); border-color:rgba(228,231,242,.32); }
.btn-danger-ghost{ background:transparent; color:var(--wolf); border:1px solid rgba(178,51,71,.4); }

/* ---------- Progress dots ---------- */
.progress{ display:flex; justify-content:center; gap:7px; flex-wrap:wrap; }
.progress .dot{ width:9px; height:9px; border-radius:50%; background:#2C3752; transition:background .2s ease, box-shadow .2s ease; }
.progress .dot.done{ background:var(--gold); box-shadow:0 0 10px var(--gold-glow); }
.progress .dot.current{ background:var(--silver); box-shadow:0 0 10px rgba(228,231,242,.6); }

/* ---------- Pass screen ---------- */
.pass-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; padding:32px 24px; }
.pass-screen .to{ font-family:var(--font-mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--silver-dim); }
.pass-screen .name{ font-family:var(--font-display); font-size:clamp(30px,8vw,46px); color:var(--gold); text-shadow:0 0 30px var(--gold-glow); }
.pass-screen .note{ color:var(--silver-dim); font-size:13.5px; max-width:320px; line-height:1.6; }
.pass-screen .btn{ max-width:280px; }

/* ---------- Card stage ---------- */
.card-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:20px; perspective:1400px; }
.card{
  width:min(280px, 78vw); aspect-ratio:5/7; position:relative; transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.2,.9,.25,1); cursor:pointer;
}
.card.flipped{ transform:rotateY(180deg); cursor:default; }
.card-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; text-align:center;
}
.card-back{
  background:
    radial-gradient(circle at 50% 40%, #2A3654, var(--ink-2) 70%);
  border:1px solid rgba(205,168,84,.35);
  box-shadow:0 0 0 1px rgba(205,168,84,.08) inset, 0 20px 50px -18px rgba(0,0,0,.7);
  animation:breathe 3.2s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{ box-shadow:0 0 0 1px rgba(205,168,84,.08) inset, 0 20px 50px -18px rgba(0,0,0,.7), 0 0 30px 0 rgba(205,168,84,0); }
  50%{ box-shadow:0 0 0 1px rgba(205,168,84,.16) inset, 0 20px 50px -18px rgba(0,0,0,.7), 0 0 40px 4px rgba(205,168,84,.25); }
}
.card-back .emblem{ width:88px; height:88px; opacity:.9; }
.card-back .tap-hint{ margin-top:14px; font-family:var(--font-mono); font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--gold); }
.card-front{
  background:linear-gradient(160deg, var(--parchment), var(--parchment-2));
  color:var(--parchment-ink);
  transform:rotateY(180deg);

}

/* ---------- Narrator ---------- */
.tabs{ display:flex; gap:8px; margin-bottom:14px; }

  flex:1; text-align:center; padding:10px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer;

}

}

.reveal-list{ display:flex; flex-direction:column; gap:8px; }

.blur-panel{ position:relative; }
.blur-panel .reveal-list.hidden{ filter:blur(8px); user-select:none; pointer-events:none; }

footer.note{ text-align:center; color:var(--silver-dim); font-size:11.5px; padding:10px 0 0; }

/* ---------- Mode selector ---------- */
.mode-select{ display:flex; gap:8px; }

/* ---------- Picker rows (night/day choices) ---------- */

.picker-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 13px; border-radius:var(--radius-md); background:var(--ink);

}

.picker-row .radio{ width:17px; height:17px; border-radius:50%; border:1.5px solid var(--silver-dim); flex:none; }

/* ---------- Tracker header ---------- */
.round-badge{ text-align:center; }
.round-badge .phase-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--silver-dim); }
.round-badge .phase-num{ font-family:var(--font-display); font-size:clamp(30px,8vw,42px); font-weight:700; }
.round-badge.night .phase-num{ color:var(--silver); text-shadow:0 0 24px rgba(228,231,242,.25); }

.recap-box{ background:rgba(228,231,242,.05); border-left:2px solid var(--gold); border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.7; color:var(--silver-dim); }

.roster{ display:flex; flex-direction:column; gap:6px; }

.roster-role{ font-family:var(--font-mono); font-size:11px; color:var(--silver-dim); }

.tab-mini{ display:flex; gap:8px; }

.journal-list{ display:flex; flex-direction:column; gap:6px; max-height:none; }

.journal-entry.marker{ font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); border-bottom:none; padding-top:12px; }

.banner-winner{
  text-align:center; padding:30px 20px; border-radius:var(--radius-lg);
  border:1px solid rgba(205,168,84,.4);
}
.banner-winner .w-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--silver-dim); }
.banner-winner .w-title{ font-family:var(--font-display); font-size:clamp(26px,7vw,36px); font-weight:700; margin:8px 0; }
.banner-winner .w-desc{ font-size:14px; color:var(--silver-dim); max-width:340px; margin:0 auto; line-height:1.6; }
.banner-winner.village{ background:linear-gradient(180deg, rgba(76,124,110,.14), transparent); }
.banner-winner.village .w-title{ color:var(--village); }

.banner-winner.amoureux .w-title{ color:var(--gold); }

.check-inline{ display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--radius-md); background:var(--ink); border:1px solid rgba(228,231,242,.1); cursor:pointer; margin-top:4px; }
.check-inline .box{ width:17px; height:17px; border-radius:5px; border:1.5px solid var(--silver-dim); flex:none; display:flex; align-items:center; justify-content:center; }
.check-inline.checked .box{ background:var(--gold); border-color:var(--gold); }
.check-inline .box svg{ width:11px; height:11px; display:none; }
.check-inline.checked .box svg{ display:block; }

/* ---------- Desktop enhancements ---------- */
.sidebar{ display:none; }
@media (min-width:900px){
  .wrap{ max-width:640px; }
  #app{ flex-direction:row; align-items:stretch; }
  .stage-col{ flex:1; display:flex; flex-direction:column; }
  .sidebar{
    display:flex; flex-direction:column; gap:10px; width:230px; padding:32px 18px;
    border-left:1px solid rgba(228,231,242,.08);
    background:rgba(0,0,0,.14);
  }
  .sidebar h3{ font-family:var(--font-display); font-size:13px; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; margin:0 0 6px; }
  .sidebar .p-row{ display:flex; align-items:center; gap:10px; font-size:13px; padding:7px 8px; border-radius:8px; color:var(--silver-dim); }
  .sidebar .p-row.done{ color:var(--silver); }
  .sidebar .p-row.current{ background:rgba(205,168,84,.1); color:var(--gold); }
  .sidebar .dotmini{ width:7px; height:7px; border-radius:50%; background:#2C3752; flex:none; }
  .sidebar .p-row.done .dotmini{ background:var(--gold); }
  .sidebar .p-row.current .dotmini{ background:var(--silver); }
  .card{ width:300px; }
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app"></div>

<script>
/* ============ Data: roles ============ */
const ICONS = {
  loup: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 46 L20 20 L32 30 L44 20 L50 46 C50 54 42 58 32 58 C22 58 14 54 14 46Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M20 20 L14 10 L26 18Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M44 20 L50 10 L38 18Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="26" cy="38" r="2.2" fill="currentColor"/><circle cx="38" cy="38" r="2.2" fill="currentColor"/><path d="M28 47 L32 51 L36 47" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  villageois: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 8 L52 24 H12 Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><rect x="18" y="24" width="28" height="26" rx="2" stroke="currentColor" stroke-width="2.4"/><rect x="28" y="34" width="8" height="16" stroke="currentColor" stroke-width="2.2"/><path d="M12 50 H52" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  voyante: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 32 C16 14 48 14 58 32 C48 50 16 50 6 32Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="32" cy="32" r="9" stroke="currentColor" stroke-width="2.4"/><circle cx="32" cy="32" r="2.6" fill="currentColor"/></svg>`,
  sorciere: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 26 H40 L44 54 H20 Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M20 34 H44" stroke="currentColor" stroke-width="2"/><rect x="27" y="10" width="10" height="16" rx="3" stroke="currentColor" stroke-width="2.2"/><path d="M27 14 H16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  chasseur: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 50 C14 30 22 12 32 8 C42 12 50 30 50 50" stroke="currentColor" stroke-width="2.4"/><path d="M22 44 H42" stroke="currentColor" stroke-width="2.2"/><path d="M32 8 V44" stroke="currentColor" stroke-width="2.2"/></svg>`,
  cupidon: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 46 C14 34 14 18 26 16 C30 15 32 20 32 20 C32 20 34 15 38 16 C50 18 50 34 32 46Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 30 L54 30" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 4"/><path d="M46 24 L54 30 L46 36" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  petitefille: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="22" r="10" stroke="currentColor" stroke-width="2.4"/><path d="M22 22 C18 34 18 44 16 54 M42 22 C46 34 46 44 48 54" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M32 32 V50" stroke="currentColor" stroke-width="2.2"/></svg>`,
  voleur: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 30 C10 22 18 16 32 16 C46 16 54 22 54 30 C46 28 38 32 32 32 C26 32 18 28 10 30Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 32 L14 50 H50 L48 32" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="26" cy="40" r="1.8" fill="currentColor"/><circle cx="38" cy="40" r="1.8" fill="currentColor"/></svg>`,
  boucemissaire: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="28" r="12" stroke="currentColor" stroke-width="2.4"/><path d="M24 20 C20 14 20 8 24 6 M40 20 C44 14 44 8 40 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M22 46 C22 38 42 38 42 46 L40 54 H24 Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
  ancien: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="20" r="9" stroke="currentColor" stroke-width="2.4"/><path d="M20 54 C20 40 44 40 44 54" stroke="currentColor" stroke-width="2.2"/><path d="M40 34 L48 56" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M44 44 L52 40" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  salvateur: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 8 L52 16 V30 C52 44 44 54 32 58 C20 54 12 44 12 30 V16 Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M32 22 V42 M22 32 H42" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`
};

const ROLE_DEFS = {
  loup: { name:"Loup-Garou", team:"loup", desc:"Chaque nuit, la meute dévore un villageois en secret." },
  villageois: { name:"Villageois", team:"village", desc:"Aucun pouvoir. Trouve les loups avant qu'il ne soit trop tard." },
  voyante: { name:"Voyante", team:"special", desc:"Chaque nuit, découvre en secret le rôle d'un joueur." },
  sorciere: { name:"Sorcière", team:"special", desc:"Une potion de vie et une potion de mort, à usage unique chacune." },
  chasseur: { name:"Chasseur", team:"special", desc:"S'il meurt, il abat aussitôt un joueur de son choix." },
  cupidon: { name:"Cupidon", team:"special", desc:"La première nuit, désigne deux amoureux liés à jamais." },
  petitefille: { name:"Petite Fille", team:"special", desc:"Peut espionner les loups la nuit, au péril de sa vie." },
  voleur: { name:"Voleur", team:"special", desc:"Peut échanger son rôle avec l'une des cartes écartées au début." },
  boucemissaire: { name:"Bouc Émissaire", team:"special", desc:"En cas d'égalité des votes, c'est lui qui est éliminé." },
  ancien: { name:"Ancien", team:"special", desc:"Résiste à la première attaque des loups." },
  salvateur: { name:"Salvateur", team:"special", desc:"Chaque nuit, protège un joueur — jamais deux fois de suite le même." }
};

const TEAM_LABEL = { loup:"Loups-Garous", village:"Village", special:"Village · rôle spécial" };
const TEAM_TAGCLASS = { loup:"tag-loup", village:"tag-village", special:"tag-special" };

const CLASSIC_SPECIALS = ["voyante","sorciere","chasseur","cupidon","petitefille"];
const EXTRA_ROLES = [
  { id:"voleur", hint:"Idéal à partir de 8-9 joueurs." },
  { id:"salvateur", hint:"Apporte une protection de nuit, utile en grand groupe." },
  { id:"ancien", hint:"Allonge la partie, conseillé à partir de 10 joueurs." },
  { id:"boucemissaire", hint:"Évite les égalités de vote interminables." }
];

const NIGHT_ORDER = ["voleur","cupidon","petitefille","salvateur","voyante","loup","sorciere"];

/* ============ State ============ */
let state = {
  screen:"setup",           // setup | pass | card | narrator | tracker
  mode:"classic",           // classic | assisted
  playerCount:6,
  names:[],
  extras:{ voleur:false, salvateur:false, ancien:false, boucemissaire:false },
  deck:[],                  // [{name, role}]
  currentIndex:0,
  narratorTab:"order",
  checkedCalls:{},
  revealShown:false
};

let game = null; // objet de suivi de partie, créé quand le mode "assisted" démarre

function calcWolfCount(n){ return Math.max(1, Math.round(n/4)); }

function buildRolePool(n){
  const wolves = calcWolfCount(n);
  let specials = CLASSIC_SPECIALS.slice();
  EXTRA_ROLES.forEach(r=>{ if(state.extras[r.id]) specials.push(r.id); });

  let removed = [];
  while (wolves + specials.length > n && specials.length > 0){
    removed.push(specials.pop());
  }
  const villagerCount = Math.max(0, n - wolves - specials.length);

  let pool = [];
  for(let i=0;i<wolves;i++) pool.push("loup");
  specials.forEach(s=>pool.push(s));
  for(let i=0;i<villagerCount;i++) pool.push("villageois");
  return { pool, wolves, specials, villagerCount, removed };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============ Render root ============ */
function render(){
  const app = document.getElementById("app");
  if(state.screen==="pass" && state.currentIndex >= state.deck.length){
    if(state.mode==="assisted" && !game){ initGameTracker(); }
    state.screen = state.mode==="assisted" ? "tracker" : "narrator";
  }
  if(state.screen==="setup"){ app.innerHTML = renderSetup(); attachSetupEvents(); }
  else if(state.screen==="pass"){ app.innerHTML = renderPass(); attachPassEvents(); }
  else if(state.screen==="card"){ app.innerHTML = renderCard(); attachCardEvents(); }
  else if(state.screen==="narrator"){ app.innerHTML = renderNarrator(); attachNarratorEvents(); }
  else if(state.screen==="tracker"){ app.innerHTML = renderTracker(); attachTrackerEvents(); }
}

/* ============ Setup screen ============ */
function renderSetup(){
  const info = buildRolePool(state.playerCount);
  const namesFilled = state.names.filter(n=>n && n.trim().length>0).length;
  const canStart = namesFilled === state.playerCount && state.playerCount>=4;

  let nameRows = "";
  for(let i=0;i<state.playerCount;i++){
    const v = state.names[i] || "";
    nameRows += `
      <div class="name-row">
        <div class="name-badge">${i+1}</div>
        <input type="text" data-idx="${i}" class="name-input" placeholder="Nom ou pseudo" value="${escapeAttr(v)}" maxlength="18" autocomplete="off">
      </div>`;
  }

  let classicRows = CLASSIC_SPECIALS.map(id=>roleRowHTML(id)).join("");
  let wolfRow = `
    <div class="role-row">
      <div class="icon" style="color:var(--wolf)">${ICONS.loup}</div>
      <div class="info"><div class="name">Loup-Garou</div></div>
      <div class="team-tag tag-loup">${info.wolves} carte${info.wolves>1?"s":""}</div>
    </div>`;
  let villagerRow = `
    <div class="role-row">
      <div class="icon" style="color:var(--village)">${ICONS.villageois}</div>
      <div class="info"><div class="name">Villageois</div></div>
      <div class="team-tag tag-village">${info.villagerCount} carte${info.villagerCount>1?"s":""}</div>
    </div>`;

  let extrasRows = EXTRA_ROLES.map(r=>{
    const def = ROLE_DEFS[r.id];
    const checked = state.extras[r.id];
    return `
      <div class="toggle-row">
        <div class="info">
          <div class="name">${def.name}</div>
          <div class="desc">${r.hint}</div>
        </div>
        <label class="switch">
          <input type="checkbox" data-extra="${r.id}" ${checked?"checked":""}>
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>`;
  }).join("");

  let warnHTML = "";
  if(info.removed.length>0){
    const names = info.removed.map(id=>ROLE_DEFS[id].name).join(", ");
    warnHTML = `<div class="warn">Pas assez de joueurs pour tout inclure — retiré pour cette partie : ${names}.</div>`;
  }

  return `
    <div class="wrap">
      <div class="moon"></div>
      <div class="eyebrow">Loups-Garous · veille de la pleine lune</div>
      <h1 class="title">Noctis</h1>
      <p class="subtitle">Configure la partie, fais tourner l'appareil, chacun découvre son rôle en secret.</p>

      <div class="panel">
        <h2>Mode de jeu</h2>
        <div class="mode-select">
          <div class="mode-opt ${state.mode==='classic'?'active':''}" data-mode="classic">
            <div class="m-name">Classique</div>
            <div class="m-desc">Distribution des cartes uniquement. Vous gérez la partie vous-mêmes.</div>
          </div>
          <div class="mode-opt ${state.mode==='assisted'?'active':''}" data-mode="assisted">
            <div class="m-name">Partie assistée</div>
            <div class="m-desc">L'appli suit les nuits, les votes, les morts et détecte la victoire.</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Joueurs</h2>
        <div class="stepper">
          <button type="button" id="dec-count" aria-label="Moins de joueurs">−</button>
          <div class="count">${state.playerCount}</div>
          <button type="button" id="inc-count" aria-label="Plus de joueurs">+</button>
        </div>
      </div>

      <div class="panel">
        <h2>Noms des joueurs</h2>
        ${nameRows}
      </div>

      <div class="panel">
        <h2>Rôles de la partie</h2>
        <div class="role-list">
          ${wolfRow}
          ${classicRows}
          ${villagerRow}
        </div>
      </div>

      <div class="panel">
        <h2>Rôles supplémentaires</h2>
        <p class="hint" style="margin-top:-6px; margin-bottom:12px;">À activer surtout si vous êtes nombreux.</p>
        ${extrasRows}
        ${warnHTML}
      </div>

      <button class="btn btn-primary" id="start-btn" ${canStart?"":"disabled"}>
        Distribuer les cartes
      </button>
      <p class="hint" id="names-hint" style="text-align:center; display:${canStart ? "none" : "block"};">Renseigne un nom pour chacun des ${state.playerCount} joueurs.</p>
      <footer class="note">Fait circuler un seul appareil — chacun regarde à son tour, sans montrer aux autres.</footer>
    </div>
  `;
}

function roleRowHTML(id){
  const def = ROLE_DEFS[id];
  return `
    <div class="role-row">
      <div class="icon" style="color:var(--gold)">${ICONS[id]}</div>
      <div class="info"><div class="name">${def.name}</div></div>
      <div class="team-tag ${TEAM_TAGCLASS[def.team]}">1 carte</div>
    </div>`;
}

function escapeAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function attachSetupEvents(){
  document.querySelectorAll("[data-mode]").forEach(el=>{
    el.onclick = ()=>{ state.mode = el.dataset.mode; render(); };
  });
  document.getElementById("dec-count").onclick = ()=>{
    if(state.playerCount>4){ state.playerCount--; render(); }
  };
  document.getElementById("inc-count").onclick = ()=>{
    if(state.playerCount<20){ state.playerCount++; render(); }
  };
  document.querySelectorAll(".name-input").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const idx = parseInt(e.target.dataset.idx,10);
      state.names[idx] = e.target.value;
      const filled = state.names.filter(n=>n && n.trim().length>0).length;
      const canStart = filled === state.playerCount && state.playerCount>=4;
      const startBtn = document.getElementById("start-btn");
      const hintEl = document.getElementById("names-hint");
      if(startBtn) startBtn.disabled = !canStart;
      if(hintEl) hintEl.style.display = canStart ? "none" : "block";
    });
  });
  document.querySelectorAll("[data-extra]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      state.extras[e.target.dataset.extra] = e.target.checked;
      const caret = e.target.selectionStart;
      render();
    });
  });
  const startBtn = document.getElementById("start-btn");
  if(startBtn){
    startBtn.onclick = ()=>{
      const info = buildRolePool(state.playerCount);
      const roles = shuffle(info.pool);
      const names = state.names.slice(0, state.playerCount).map(n=>n.trim());
      state.deck = names.map((n,i)=>({ name:n, role:roles[i] }));
      state.currentIndex = 0;
      state.checkedCalls = {};
      state.revealShown = false;
      state.screen = "pass";
      render();
    };
  }
}

          <div class="to">Passe l'appareil à</div>

      </div>

function progressDotsHTML(){

    let cls = "dot";

function sidebarHTML(){
  const rows = state.deck.map((p,i)=>{
    let cls = "p-row";
    if(i < state.currentIndex) cls += " done";
    else if(i === state.currentIndex) cls += " current";

function escapeHTML(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function attachPassEvents(){

    const checked = !!state.checkedCalls[r];

          <div class="name" style="font-size:14px;">${def.name}${r==='cupidon'||r==='voleur' ? ' <span style="color:var(--silver-dim); font-weight:400;">(1ère nuit)</span>' : ''}</div>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>`;

  const revealRows = state.deck.map(p=>{

    return `<div class="reveal-row"><div class="pname">${escapeHTML(p.name)}</div><div class="prole" style="color:${color}">${def.name}</div></div>`;
  }).join("");

  const orderTabContent = `
    <div class="panel">
      <h2>Ordre d'appel — nuit</h2>
      ${orderItems || '<p class="hint">Aucun rôle actif de nuit dans cette partie.</p>'}

    </div>`;

  const revealTabContent = `
    <div class="panel blur-panel">
      <h2>Répartition complète</h2>
      <div class="reveal-list ${state.revealShown ? "" : "hidden"}">${revealRows}</div>
      ${!state.revealShown ? `<div class="reveal-cover"><button class="btn btn-ghost" id="show-reveal-btn" style="width:auto; padding:12px 20px;">Révéler la liste (narrateur uniquement)</button></div>` : ""}
    </div>`;

  return `
    <div class="wrap">
      <div class="eyebrow">Vue du narrateur</div>
      <h1 class="title" style="font-size:26px;">Meneur de jeu</h1>
      <div class="tabs">

function attachNarratorEvents(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state.narratorTab = t.dataset.tab; render(); };
  });
  document.querySelectorAll(".order-item").forEach(item=>{
    item.onclick = ()=>{
      const r = item.dataset.role;
      state.checkedCalls[r] = !state.checkedCalls[r];
      render();
    };
  });
  const revealBtn = document.getElementById("show-reveal-btn");
  if(revealBtn){
    revealBtn.onclick = ()=>{ state.revealShown = true; render(); };
  }
  document.getElementById("new-round-btn").onclick = ()=>{
    const names = state.deck.map(p=>p.name);
    const info = buildRolePool(names.length);
    const roles = shuffle(info.pool);
    state.deck = names.map((n,i)=>({ name:n, role:roles[i] }));
    state.currentIndex = 0;
    state.checkedCalls = {};
    state.revealShown = false;
    state.narratorTab = "order";
    state.screen = "pass";

    state.names = state.deck.map(p=>p.name);
    state.screen = "setup";
    render();
  };
}

/* ============ Assisted mode: game tracker ============ */
function initGameTracker(){
  game = {
    round:1,
    phase:"night",              // night | day | over
    winner:null,
    awaitingHunter:null,
    players: state.deck.map(p=>({ name:p.name, role:p.role, alive:true, deathCause:null })),
    lovers:null,
    cupidonUsed:false,
    ancienImmunityUsed:false,
    sorciereLife:true,
    sorciereDeath:true,
    protectedLastNight:null,
    nightDraft:{ wolfVictim:null, noVictim:false, saveWithLife:false, deathTarget:null, protectTarget:null, loverA:null, loverB:null },
    dayDraft:{ voteTarget:null, tie:false },
    deathQueue:[],
    journal:[],
    view:"main"                 // main | journal | roles
  };
}

function getPlayer(name){ return game.players.find(p=>p.name===name); }
function alivePlayers(){ return game.players.filter(p=>p.alive); }
function hasAliveRole(role){ return game.players.some(p=>p.alive && p.role===role); }
function isDefeated(){ return !!game.winner; }

function deathCauseLabel(cause){
  return {
    loups:"dévoré(e) par les Loups-Garous",
    potion:"empoisonné(e) par la Sorcière",
    vote:"éliminé(e) par le vote du village",
    bouc:"désigné(e) (Bouc Émissaire, égalité des votes)",
    amour:"mort(e) de chagrin d'amour",
    chasseur:"emporté(e) par le Chasseur"
  }[cause] || "éliminé(e)";
}

function stepDeathQueue(){
  if(game.awaitingHunter) return;
  if(game.deathQueue.length===0){ finalizeResolution(); return; }
  const d = game.deathQueue.shift();
  const p = getPlayer(d.name);
  if(!p || !p.alive){ stepDeathQueue(); return; }
  p.alive = false;
  p.deathCause = d.cause;
  const def = ROLE_DEFS[p.role];
  game.journal.push(`${p.name} — ${deathCauseLabel(d.cause)}. Il·elle était ${def.name}.`);

  if(game.lovers && game.lovers.includes(p.name)){
    const other = game.lovers.find(n=>n!==p.name);
    const op = getPlayer(other);
    if(op && op.alive){
      game.deathQueue.unshift({ name:other, cause:"amour" });
    }
  }

  if(p.role==="chasseur"){
    game.awaitingHunter = p.name;
    render();
    return;
  }
  stepDeathQueue();
}

function continueAfterHunter(targetName){
  game.deathQueue.unshift({ name:targetName, cause:"chasseur" });
  game.awaitingHunter = null;
  stepDeathQueue();
}

function checkWinCondition(){
  const alive = alivePlayers();
  if(game.lovers){
    const [a,b] = game.lovers;
    const pa = getPlayer(a), pb = getPlayer(b);
    if(pa && pb && pa.alive && pb.alive && alive.length===2){
      game.winner = "amoureux";
      return;
    }
  }
  const wolves = alive.filter(p=>p.role==="loup").length;
  const others = alive.length - wolves;
  if(wolves===0){ game.winner = "village"; return; }
  if(wolves>=others){ game.winner = "loups"; return; }
  game.winner = null;
}

function finalizeResolution(){
  checkWinCondition();
  if(game.winner){
    game.phase = "over";
  } else if(game.phase==="night"){
    game.phase = "day";
  } else {
    game.protectedLastNight = game.nightDraft.protectTarget || game.protectedLastNight;
    game.phase = "night";
    game.round++;
    game.nightDraft = { wolfVictim:null, noVictim:false, saveWithLife:false, deathTarget:null, protectTarget:null, loverA:null, loverB:null };
  }
  render();
}

function validateNight(){
  const draft = game.nightDraft;
  let deaths = [];
  let notes = [];

  if(draft.wolfVictim && !draft.noVictim){
    const victim = getPlayer(draft.wolfVictim);
    let saved = false;
    if(draft.protectTarget && draft.protectTarget===victim.name){
      saved = true; notes.push(`${victim.name} était protégé(e) par le Salvateur.`);
    }
    if(victim.role==="ancien" && !game.ancienImmunityUsed){
      saved = true; game.ancienImmunityUsed = true;
      notes.push(`${victim.name} (l'Ancien) survit à cette première attaque.`);
    }
    if(draft.saveWithLife && game.sorciereLife){
      saved = true; game.sorciereLife = false;
      notes.push(`La Sorcière sauve ${victim.name} avec sa potion de vie.`);
    }
    if(!saved){ deaths.push({ name:victim.name, cause:"loups" }); }
  }
  if(draft.deathTarget && game.sorciereDeath){
    deaths.push({ name:draft.deathTarget, cause:"potion" });
    game.sorciereDeath = false;
  }
  if(draft.loverA && draft.loverB && draft.loverA!==draft.loverB && !game.cupidonUsed){
    game.lovers = [draft.loverA, draft.loverB];
    game.cupidonUsed = true;
    notes.push(`Cupidon lie ${draft.loverA} et ${draft.loverB} pour toujours.`);
  }

  game.journal.push(`— Nuit ${game.round} —`);
  notes.forEach(n=>game.journal.push(n));
  if(deaths.length===0 && notes.filter(n=>!n.startsWith("Cupidon")).length===0 && !notes.some(n=>n.includes("protégé")||n.includes("Ancien")||n.includes("sauve"))){
    // no-op, message added below only if truly nothing happened
  }
  if(deaths.length===0){ game.journal.push("Le village se réveille : personne n'est mort cette nuit."); }

  game.deathQueue = [];
  game.deathQueue.push(...deaths);
  stepDeathQueue();
}

function validateDay(){
  const draft = game.dayDraft;
  let deaths = [];
  game.journal.push(`— Jour ${game.round} —`);
  if(draft.tie){
    const scapegoat = game.players.find(p=>p.alive && p.role==="boucemissaire");
    if(scapegoat){
      deaths.push({ name:scapegoat.name, cause:"bouc" });
    } else {
      game.journal.push("Égalité des votes : personne n'est éliminé.");
    }
  } else if(draft.voteTarget){
    deaths.push({ name:draft.voteTarget, cause:"vote" });
  } else {
    game.journal.push("Le village ne parvient pas à voter : personne n'est éliminé.");
  }
  game.dayDraft = { voteTarget:null, tie:false };
  game.deathQueue = [];
  game.deathQueue.push(...deaths);
  stepDeathQueue();
}

/* ---------- Tracker rendering ---------- */
function renderTracker(){
  if(game.view==="journal") return renderJournalView();
  if(game.view==="roles") return renderRolesView();
  if(game.winner) return renderGameOver();
  if(game.awaitingHunter) return renderHunterPick();
  if(game.phase==="night") return renderNightScreen();
  return renderDayScreen();
}

function rosterHTML(){
  const rows = game.players.map(p=>{
    const def = ROLE_DEFS[p.role];
    if(p.alive){
      return `<div class="roster-row"><span class="roster-dot"></span><span class="roster-name">${escapeHTML(p.name)}</span></div>`;
    }
    return `<div class="roster-row dead"><span class="roster-dot"></span><span class="roster-name">${escapeHTML(p.name)}</span><span class="roster-role">${def.name}</span></div>`;
  }).join("");
  return `<div class="panel"><h2>Effectifs (${alivePlayers().length} vivants)</h2><div class="roster">${rows}</div></div>`;
}

function trackerNav(){
  return `
    <div class="tab-mini">
      <button class="btn btn-ghost" id="view-journal-btn" style="font-size:13px; padding:10px;">Journal</button>
      <button class="btn btn-ghost" id="view-roles-btn" style="font-size:13px; padding:10px;">Répartition</button>
    </div>`;
}

function pickerRow(name, selected, disabled, sublabel){
  return `
    <div class="picker-row ${selected?'selected':''} ${disabled?'disabled':''}" data-picker-name="${escapeAttr(name)}">
      <div>
        <div class="pname">${escapeHTML(name)}</div>
        ${sublabel ? `<div class="psub">${sublabel}</div>` : ""}
      </div>
      <div class="radio"></div>
    </div>`;
}

function renderNightScreen(){
  const draft = game.nightDraft;
  const alive = alivePlayers();

  let cupidonSection = "";
  if(hasAliveRole("cupidon") && game.round===1 && !game.cupidonUsed){
    const rows = alive.map(p=>{
      const selA = draft.loverA===p.name, selB = draft.loverB===p.name;
      return pickerRow(p.name, selA||selB, false, selA?"Amoureux ①":selB?"Amoureux ②":"");
    }).join("");
    cupidonSection = `
      <div class="panel">
        <h2>Cupidon — désigne deux amoureux</h2>
        <p class="hint" style="margin-top:-6px;">Touche deux joueurs (dans l'ordre).</p>
        <div class="picker-list" data-picker-group="lovers">${rows}</div>
      </div>`;
  }

  let salvateurSection = "";
  if(hasAliveRole("salvateur")){
    const rows = alive.map(p=>{
      const disabled = game.protectedLastNight===p.name;
      return pickerRow(p.name, draft.protectTarget===p.name, disabled, disabled?"protégé(e) la nuit dernière":"");
    }).join("");
    salvateurSection = `
      <div class="panel">
        <h2>Salvateur — protège un joueur</h2>
        <div class="picker-list" data-picker-group="protect">${rows}</div>
      </div>`;
  }

  const wolfRows = alive.filter(p=>p.role!=="loup").map(p=>pickerRow(p.name, draft.wolfVictim===p.name && !draft.noVictim, draft.noVictim)).join("");
  const wolfSection = `
    <div class="panel">
      <h2>Loups-Garous — désignent leur victime</h2>
      <div class="picker-list" data-picker-group="wolf">${wolfRows}</div>
      <div class="check-inline ${draft.noVictim?'checked':''}" id="no-victim-check">
        <div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="lbl">Aucune victime cette nuit</div>
      </div>
    </div>`;

  let sorciereSection = "";
  if(hasAliveRole("sorciere") && (game.sorciereLife || game.sorciereDeath)){
    let lifePart = "";
    if(game.sorciereLife && draft.wolfVictim && !draft.noVictim){
      lifePart = `
        <div class="check-inline ${draft.saveWithLife?'checked':''}" id="save-life-check">
          <div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="lbl">Sauver ${escapeHTML(draft.wolfVictim)} avec la potion de vie</div>
        </div>`;
    } else if(game.sorciereLife){
      lifePart = `<p class="hint">Potion de vie disponible — désignez d'abord la victime des loups pour pouvoir la sauver.</p>`;
    }
    let deathPart = "";
    if(game.sorciereDeath){
      const rows = alive.map(p=>pickerRow(p.name, draft.deathTarget===p.name, false)).join("");
      deathPart = `
        <p class="hint" style="margin-top:10px;">Potion de mort — cible optionnelle :</p>
        <div class="picker-list" data-picker-group="witchdeath">${rows}</div>`;
    }
    sorciereSection = `
      <div class="panel">
        <h2>Sorcière</h2>
        ${lifePart}
        ${deathPart}
      </div>`;
  }

  return `
    <div class="wrap">
      <div class="round-badge night">
        <div class="phase-eyebrow">Phase de nuit</div>
        <div class="phase-num">Nuit ${game.round}</div>
      </div>
      ${trackerNav()}
      ${cupidonSection}
      ${salvateurSection}
      ${wolfSection}
      ${sorciereSection}
      <button class="btn btn-primary" id="validate-night-btn">Valider la nuit</button>
      ${rosterHTML()}
    </div>`;
}

function renderDayScreen(){
  const draft = game.dayDraft;
  const alive = alivePlayers();
  const recapLines = [];
  for(let i=game.journal.length-1;i>=0;i--){
    const line = game.journal[i];
    recapLines.unshift(line);
    if(line.startsWith("— Nuit")) break;
  }
  const recap = recapLines.map(l=>l.startsWith("—") ? `<strong>${l.replace(/—/g,'').trim()}</strong>` : l).join("<br>");

  const rows = alive.map(p=>pickerRow(p.name, draft.voteTarget===p.name && !draft.tie, draft.tie)).join("");

  return `
    <div class="wrap">
      <div class="round-badge day">
        <div class="phase-eyebrow">Phase de jour</div>
        <div class="phase-num">Jour ${game.round}</div>
      </div>
      ${trackerNav()}
      <div class="panel">
        <h2>Cette nuit</h2>
        <div class="recap-box">${recap || "Rien à signaler."}</div>
      </div>
      <div class="panel">
        <h2>Vote du village</h2>
        <div class="picker-list" data-picker-group="vote">${rows}</div>
        <div class="check-inline ${draft.tie?'checked':''}" id="tie-check">
          <div class="box"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12 L10 18 L20 6" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="lbl">Égalité des votes</div>
        </div>
      </div>
      <button class="btn btn-primary" id="validate-day-btn">Valider le vote</button>
      ${rosterHTML()}
    </div>`;
}

function renderHunterPick(){
  const alive = alivePlayers().filter(p=>p.name!==game.awaitingHunter);
  const rows = alive.map(p=>`<div class="picker-row" data-hunter-target="${escapeAttr(p.name)}">
      <div class="pname">${escapeHTML(p.name)}</div><div class="radio"></div>
    </div>`).join("");
  return `
    <div class="wrap">
      <div class="round-badge night"><div class="phase-eyebrow">Dernière volonté</div><div class="phase-num" style="font-size:26px;">Le Chasseur tire</div></div>
      <div class="panel">
        <h2>${escapeHTML(game.awaitingHunter)} emporte un joueur avec lui</h2>
        <div class="picker-list">${rows}</div>
      </div>
    </div>`;
}

function renderGameOver(){
  const map = {
    village:{ title:"Le Village triomphe", desc:"Tous les Loups-Garous ont été éliminés. Noctis peut dormir tranquille." },
    loups:{ title:"Les Loups-Garous l'emportent", desc:"La meute est désormais aussi nombreuse que ses proies. Le village est perdu." },
    amoureux:{ title:"Les Amoureux gagnent", desc:"Envers et contre tout, ils sont les deux derniers survivants." }
  };
  const info = map[game.winner];
  const rows = game.players.map(p=>{
    const def = ROLE_DEFS[p.role];
    const color = def.team==="loup"?"var(--wolf)":def.team==="village"?"var(--village)":"var(--gold)";
    return `<div class="reveal-row"><div class="pname">${escapeHTML(p.name)} ${p.alive?'':'💀'}</div><div class="prole" style="color:${color}">${def.name}</div></div>`;
  }).join("");

  return `
    <div class="wrap">
      <div class="banner-winner ${game.winner}">
        <div class="w-eyebrow">Partie terminée</div>
        <div class="w-title">${info.title}</div>
        <p class="w-desc">${info.desc}</p>
      </div>
      <div class="panel">
        <h2>Répartition finale</h2>
        <div class="reveal-list">${rows}</div>
      </div>
      <button class="btn btn-ghost" id="new-round-btn">Nouvelle partie (mêmes joueurs)</button>
      <button class="btn btn-danger-ghost" id="edit-players-btn">Modifier les joueurs</button>
    </div>`;
}

function renderJournalView(){
  const entries = game.journal.map(l=>{
    const isMarker = l.startsWith("—");
    return `<div class="journal-entry ${isMarker?'marker':''}">${isMarker ? l.replace(/—/g,'').trim() : l}</div>`;
  }).join("");
  return `
    <div class="wrap">
      <div class="eyebrow">Journal de la partie</div>
      <h1 class="title" style="font-size:24px;">Chronique</h1>
      <div class="panel journal-list">${entries || '<p class="hint">Rien a raconter pour l\u2019instant.</p>'}</div>
      <button class="btn btn-ghost" id="back-to-game-btn">Retour à la partie</button>
    </div>`;
}

function renderRolesView(){
  const rows = game.players.map(p=>{
    const def = ROLE_DEFS[p.role];
    const color = def.team==="loup"?"var(--wolf)":def.team==="village"?"var(--village)":"var(--gold)";
    return `<div class="reveal-row"><div class="pname">${escapeHTML(p.name)}${p.alive?'':' 💀'}</div><div class="prole" style="color:${color}">${def.name}</div></div>`;
  }).join("");
  return `
    <div class="wrap">
      <div class="eyebrow">Vue narrateur</div>
      <h1 class="title" style="font-size:24px;">Répartition complète</h1>
      <div class="panel"><div class="reveal-list">${rows}</div></div>
      <button class="btn btn-ghost" id="back-to-game-btn">Retour à la partie</button>
    </div>`;
}

/* ---------- Tracker events ---------- */
function attachTrackerEvents(){
  const backBtn = document.getElementById("back-to-game-btn");
  if(backBtn){ backBtn.onclick = ()=>{ game.view = "main"; render(); }; return; }

  const journalBtn = document.getElementById("view-journal-btn");
  if(journalBtn) journalBtn.onclick = ()=>{ game.view = "journal"; render(); };
  const rolesBtn = document.getElementById("view-roles-btn");
  if(rolesBtn) rolesBtn.onclick = ()=>{ game.view = "roles"; render(); };

  // hunter pick
  document.querySelectorAll("[data-hunter-target]").forEach(row=>{
    row.onclick = ()=>{ continueAfterHunter(row.dataset.hunterTarget); };
  });
  if(document.querySelectorAll("[data-hunter-target]").length) return;

  if(game.winner){
    const nrBtn = document.getElementById("new-round-btn");
    if(nrBtn) nrBtn.onclick = ()=>{
      const names = state.deck.map(p=>p.name);
      const info = buildRolePool(names.length);
      const roles = shuffle(info.pool);
      state.deck = names.map((n,i)=>({ name:n, role:roles[i] }));
      state.currentIndex = 0;
      game = null;
      state.screen = "pass";
      render();
    };
    const epBtn = document.getElementById("edit-players-btn");
    if(epBtn) epBtn.onclick = ()=>{
      state.playerCount = state.deck.length;
      state.names = state.deck.map(p=>p.name);
      game = null;
      state.screen = "setup";
      render();
    };
    return;
  }

  // picker rows (single or multi depending on group)
  document.querySelectorAll("[data-picker-group]").forEach(group=>{
    const kind = group.dataset.pickerGroup;
    group.querySelectorAll(".picker-row").forEach(row=>{
      row.onclick = ()=>{
        if(row.classList.contains("disabled")) return;
        const name = row.dataset.pickerName;
        const draft = game.phase==="night" ? game.nightDraft : game.dayDraft;
        if(kind==="lovers"){
          if(draft.loverA===name){ draft.loverA=null; }
          else if(draft.loverB===name){ draft.loverB=null; }
          else if(!draft.loverA){ draft.loverA=name; }
          else if(!draft.loverB){ draft.loverB=name; }
          else { draft.loverA=draft.loverB; draft.loverB=name; }
        } else if(kind==="protect"){
          draft.protectTarget = draft.protectTarget===name ? null : name;
        } else if(kind==="wolf"){
          draft.wolfVictim = draft.wolfVictim===name ? null : name;
          draft.noVictim = false;
        } else if(kind==="witchdeath"){
          draft.deathTarget = draft.deathTarget===name ? null : name;
        } else if(kind==="vote"){
          draft.voteTarget = draft.voteTarget===name ? null : name;
          draft.tie = false;
        }
        render();
      };
    });
  });

  const noVictimCheck = document.getElementById("no-victim-check");
  if(noVictimCheck) noVictimCheck.onclick = ()=>{
    game.nightDraft.noVictim = !game.nightDraft.noVictim;
    if(game.nightDraft.noVictim) game.nightDraft.wolfVictim = null;
    render();
  };
  const saveLifeCheck = document.getElementById("save-life-check");
  if(saveLifeCheck) saveLifeCheck.onclick = ()=>{
    game.nightDraft.saveWithLife = !game.nightDraft.saveWithLife;
    render();
  };
  const tieCheck = document.getElementById("tie-check");
  if(tieCheck) tieCheck.onclick = ()=>{
    game.dayDraft.tie = !game.dayDraft.tie;
    if(game.dayDraft.tie) game.dayDraft.voteTarget = null;
    render();
  };

  const validateNightBtn = document.getElementById("validate-night-btn");
  if(validateNightBtn) validateNightBtn.onclick = validateNight;
  const validateDayBtn = document.getElementById("validate-day-btn");
  if(validateDayBtn) validateDayBtn.onclick = validateDay;
}

/* ============ Ambient stars ============ */
function initStars(){
  const el = document.getElementById("stars");
  let html = "";
  for(let i=0;i<50;i++){
    const top = Math.random()*100;
    const left = Math.random()*100;
    const delay = (Math.random()*4).toFixed(2);
    html += `<span style="top:${top}%; left:${left}%; animation-delay:${delay}s;"></span>`;
  }
  el.innerHTML = html;
}

initStars();
render();
</script>
